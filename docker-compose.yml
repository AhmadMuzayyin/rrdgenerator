services:
  rrdgenerator:
    image: node:20-alpine
    restart: unless-stopped
    environment:
      TZ: Asia/Jakarta
      PORT: 3000
    ports:
      - "7101:3000"
    command: >
      sh -c "apk add --no-cache git rrdtool &&
             if [ -d /app/.git ]; then
               cd /app && git pull
             else
               git clone https://github.com/AhmadMuzayyin/rrdgenerator.git /app && cd /app && npm install
             fi &&
             exec npm start"
