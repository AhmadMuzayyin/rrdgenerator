# Jalankan: docker compose up -d --build
#
# NETWORK: digabung ke "barokah-network" — network ini SUDAH ADA di host (dibuat
# manual/lewat service barokah lain, bukan oleh compose ini), makanya external:true.
# Ini supaya reverse proxy (Zoraxy) atau service barokah lain yang jalan di network
# yang sama bisa menjangkau container ini lewat nama container-nya.

networks:
  barokah-network:
    name: barokah-network
    external: true

services:
  rrdgenerator:
    build: .
    container_name: rrdgenerator
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Asia/Jakarta}
    ports:
      - "7101:3000"
    networks:
      - barokah-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
