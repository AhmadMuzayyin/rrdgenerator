services:
  rrdgenerator:
    image: node:20-alpine
    container_name: rrdgenerator
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      PORT: 3000
    ports:
      - "7101:3000"
    command: sh -c "apk add --no-cache rrdtool && ([ -d node_modules ] || npm install) && node index.js"
